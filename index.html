<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetria Compressori - RMF Magliano Alpi</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #map { width: 100vw; height: 100vh; }

    /* Estilos del Popup */
    .popup-card { min-width: 260px; font-size: 13px; line-height: 1.5; }
    .popup-header {
      font-size: 15px; font-weight: bold;
      border-bottom: 2px solid #007bff;
      padding-bottom: 5px; margin-bottom: 8px; color: #333;
    }
    .badge {
      display: inline-block; padding: 3px 8px;
      border-radius: 12px; font-size: 11px; font-weight: bold;
      color: white; margin-bottom: 8px;
    }
    .status-marcha { background-color: #28a745; }
    .status-parado { background-color: #6c757d; }
    
    /* Alerta visual de Mantenimiento */
    .alerta-mantenimiento {
      background-color: #dc3545; color: white;
      padding: 8px; border-radius: 5px;
      font-weight: bold; text-align: center;
      margin-top: 10px;
      animation: parpadeo 1s infinite alternate;
    }

    @keyframes parpadeo {
      from { opacity: 1; }
      to { opacity: 0.4; }
    }

    .data-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
    .data-table td { padding: 3px 0; }
    .data-table td:last-child { text-align: right; font-weight: bold; }
    
    .last-packet {
      font-size: 10px;
      color: #666;
      text-align: right;
      margin-top: 8px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- CONFIGURACIÓN ---
    const NOMBRE_CLIENTE = "RMF MAGLIANO ALPI";
    const LATITUD = 44.4601;   // Magliano Alpi, Italia
    const LONGITUD = 7.8016;
    const CHANNEL_ID = "3425995"; 

    // Inicializar mapa
    const map = L.map('map').setView([LATITUD, LONGITUD], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    const marker = L.marker([LATITUD, LONGITUD]).addTo(map);

    // Convierte horas decimales reales a formato legible "0h 54m"
    function formatHorasMinutos(val) {
      if (val === null || val === undefined || val === "") return "0h 00m";
      const horasDecimales = parseFloat(val);
      if (isNaN(horasDecimales)) return "0h 00m";

      const horas = Math.floor(horasDecimales);
      const minutos = Math.round((horasDecimales - horas) * 60);

      if (minutos === 60) {
        return `${horas + 1}h 00m`;
      }

      const minStr = minutos < 10 ? `0${minutos}` : `${minutos}`;
      return `${horas}h ${minStr}m`;
    }

    function formatEntero(val) {
      if (val === null || val === undefined || val === "") return "0";
      const n = Math.round(parseFloat(val));
      return isNaN(n) ? "0" : n.toString();
    }

    async function cargarDatosThingSpeak() {
      const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=1&_nocache=${Date.now()}`;

      try {
        const response = await fetch(url, { cache: "no-store" });
        const json = await response.json();

        if (!json.feeds || json.feeds.length === 0) return;

        const data = json.feeds[0];

        const horasCarico      = formatHorasMinutos(data.field1);
        const horasVacio       = formatHorasMinutos(data.field2);
        const horasProgramadas = formatEntero(data.field3) + " h";
        const horasRestantes   = formatHorasMinutos(data.field4);
        const totalHistorico   = formatHorasMinutos(data.field5);
        const enMarcha         = (String(data.field6).trim() === "1"); 
        const avviamenti       = formatEntero(data.field7);

        let horaUltimoEnvio = "Sconosciuto";
        if (data.created_at) {
          const d = new Date(data.created_at);
          horaUltimoEnvio = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        const requiereMantenimiento = (parseFloat(data.field4 || 0) <= 0);

        let popupContent = `
          <div class="popup-card">
            <div class="popup-header">${NOMBRE_CLIENTE}</div>

            <div>
              <span class="badge ${enMarcha ? 'status-marcha' : 'status-parado'}">
                ${enMarcha ? 'IN MARCIA' : 'FERMO'}
              </span>
            </div>

            <table class="data-table">
              <tr><td>Ore Carico:</td><td>${horasCarico}</td></tr>
              <tr><td>Ore Vuoto:</td><td>${horasVacio}</td></tr>
              <tr><td><strong>Ore Totali:</strong></td><td><strong>${totalHistorico}</strong></td></tr>
              <tr><td>Avviamenti:</td><td>${avviamenti}</td></tr>
              <tr><td colspan="2"><hr style="border: 0.5px solid #eee; margin: 4px 0;"></td></tr>
              <tr><td>Ciclo Programmato:</td><td>${horasProgramadas}</td></tr>
              <tr><td>Tempo Manutenzione:</td><td>${horasRestantes}</td></tr>
            </table>

            <div class="last-packet">
              Ultimo aggiornamento: <strong>${horaUltimoEnvio}</strong>
            </div>
        `;

        if (requiereMantenimiento) {
          popupContent += `
            <div class="alerta-mantenimiento">
              ⚠️ MANUTENZIONE RICHIESTA!
            </div>
          `;
        }

        popupContent += `</div>`;

        marker.bindPopup(popupContent);
        if (!marker.isPopupOpen()) {
          marker.openPopup();
        }

      } catch (error) {
        console.error("Error al obtener datos de ThingSpeak:", error);
      }
    }

    cargarDatosThingSpeak();
    setInterval(cargarDatosThingSpeak, 15000);
  </script>
</body>
</html>
