<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoraggio Compressori - RMF Magliano Alpi</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    /* Estilos del PopUp de Leaflet */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .leaflet-popup-content {
      margin: 14px;
      min-width: 260px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .status-online {
      background-color: #e6fffa;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .status-offline {
      background-color: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
      color: #4a5568;
    }

    .data-row.bold {
      font-weight: 700;
      color: #1a202c;
    }

    .data-value {
      font-weight: 700;
      color: #000;
    }

    .divider {
      height: 1px;
      background-color: #e2e8f0;
      margin: 10px 0;
    }

    .last-update {
      font-size: 11px;
      color: #a0aec0;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // -----------------------------------------------------------
    // CONFIGURACIÓN DE THINGSPEAK
    // -----------------------------------------------------------
    const CHANNEL_ID = 'TU_CHANNEL_ID'; // Reemplazar con ID de ThingSpeak si aplica
    const READ_API_KEY = 'TU_READ_API_KEY'; // Reemplazar si es canal privado
    const URL_THINGSPEAK = `https://api.thingspeak.com/channels/2290466/feeds/last.json`;

    // Inicializar Mapa centrado en Magliano Alpi
    const map = L.map('map').setView([44.4578, 7.8042], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker = L.marker([44.4578, 7.8042]).addTo(map);

    async function cargarDatosCompressore() {
      try {
        const res = await fetch(URL_THINGSPEAK);
        const data = await res.json();

        // -----------------------------------------------------------
        // FORMATEO DE DATOS - ENTEROS SIN DECIMALES (.toFixed(0))
        // -----------------------------------------------------------
        const minutosCarga = parseFloat(data.field1 || 0).toFixed(0);
        const minutosVacio = parseFloat(data.field2 || 0).toFixed(0);
        const seteoMantenimiento = parseFloat(data.field3 || 1500).toFixed(0);
        const horasRestantes = parseFloat(data.field4 || 0).toFixed(1);
        const horasTotales = parseFloat(data.field5 || 0).toFixed(1);
        const enMarcha = data.field6 === "1";
        const avviamenti = parseInt(data.field7 || 0);

        const popupContent = `
          <div class="card-title">RMF MAGLIANO ALPI</div>
          
          <span class="status-badge ${enMarcha ? 'status-online' : 'status-offline'}">
            ● ${enMarcha ? 'In Funzione' : 'Fermo'}
          </span>

          <div class="data-row">
            <span>Minuti Carico:</span>
            <span class="data-value">${minutosCarga}</span>
          </div>

          <div class="data-row">
            <span>Minuti Vuoto:</span>
            <span class="data-value">${minutosVacio}</span>
          </div>

          <div class="data-row bold">
            <span>Totale Ore:</span>
            <span class="data-value">${horasTotales}</span>
          </div>

          <div class="divider"></div>

          <div class="data-row">
            <span>Seteo Manutenzione:</span>
            <span class="data-value">${seteoMantenimiento}</span>
          </div>

          <div class="data-row">
            <span>Tempo Manutenzione:</span>
            <span class="data-value">${horasRestantes}</span>
          </div>

          <div class="data-row">
            <span>Avviamenti:</span>
            <span class="data-value">${avviamenti}</span>
          </div>

          <div class="last-update">
            Aggiornato: ${new Date(data.created_at).toLocaleTimeString()}
          </div>
        `;

        marker.bindPopup(popupContent).openPopup();

      } catch (err) {
        console.error("Errore nel caricamento dei dati:", err);
      }
    }

    // Carga inicial y refresco cada 30 segundos
    cargarDatosCompressore();
    setInterval(cargarDatosCompressore, 30000);
  </script>
</body>
</html>
