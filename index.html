<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetria Compressori - RMF Magliano Alpi</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #map { width: 100vw; height: 100vh; }

    /* Stili del Popup */
    .popup-card { min-width: 260px; font-size: 13px; line-height: 1.5; }
    .popup-header {
      font-size: 15px; font-weight: bold;
      border-bottom: 2px solid #007bff;
      padding-bottom: 5px; margin-bottom: 8px; color: #333;
    }
    .badge {
      display: inline-block; padding: 3px 8px;
      border-radius: 12px; font-size: 11px; font-weight: bold;
      color: white; margin-bottom: 8px;
    }
    .status-marcha { background-color: #28a745; }
    .status-parado { background-color: #6c757d; }
    
    /* Allarme visivo Manutenzione */
    .alerta-mantenimiento {
      background-color: #dc3545; color: white;
      padding: 8px; border-radius: 5px;
      font-weight: bold; text-align: center;
      margin-top: 10px;
      animation: parpadeo 1s infinite alternate;
    }

    .error-box {
      background-color: #f8d7da; color: #721c24;
      padding: 8px; border-radius: 5px;
      font-size: 11px; margin-top: 8px;
      border: 1px solid #f5c6cb;
    }

    @keyframes parpadeo {
      from { opacity: 1; }
      to { opacity: 0.4; }
    }

    .data-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
    .data-table td { padding: 3px 0; }
    .data-table td:last-child { text-align: right; font-weight: bold; }
    
    .last-packet {
      font-size: 10px;
      color: #666;
      text-align: right;
      margin-top: 8px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- CONFIGURAZIONE ---
    const NOMBRE_CLIENTE = "RMF MAGLIANO ALPI";
    const LATITUD = 44.4601;   // Magliano Alpi, Italia
    const LONGITUD = 7.8016;
    const CHANNEL_ID = "3425995"; 

    // Inizializzare la mappa
    const map = L.map('map').setView([LATITUD, LONGITUD], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    const marker = L.marker([LATITUD, LONGITUD]).addTo(map);
    const popup = L.popup({ autoClose: false, closeOnClick: false });
    marker.bindPopup(popup);

    function parseEnteroSeguro(valor) {
      if (valor === null || valor === undefined || valor === "") return 0;
      const num = Number(valor);
      return isNaN(num) ? 0 : Math.round(num);
    }

    async function cargarDatosThingSpeak() {
      // Forzar lectura fresca sin caché
      const timestamp = new Date().getTime();
      const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?_=${timestamp}`;

      try {
        const response = await fetch(url, { cache: "no-store" });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} (Verificar que el Canal en ThingSpeak sea PÚBLICO)`);
        }

        const data = await response.json();

        if (!data || Object.keys(data).length === 0 || data === -1) {
          throw new Error("Canal sin datos registrados aún o privado.");
        }

        // Mappatura ESP32
        const horasCarico      = parseEnteroSeguro(data.field1);
        const horasVacio       = parseEnteroSeguro(data.field2);
        const horasProgramadas = parseEnteroSeguro(data.field3);
        const horasRestantes   = parseEnteroSeguro(data.field4);
        const totalHistorico   = parseEnteroSeguro(data.field5);
        const enMarcha         = String(data.field6).trim() === "1";
        const avviamenti       = parseEnteroSeguro(data.field7);

        // Ultimo aggiornamento
        let horaUltimoEnvio = "Sconosciuto";
        if (data.created_at) {
          const d = new Date(data.created_at);
          horaUltimoEnvio = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        const requiereMantenimiento = (horasRestantes <= 0);

        let popupContent = `
          <div class="popup-card">
            <div class="popup-header">${NOMBRE_CLIENTE}</div>

            <div>
              <span class="badge ${enMarcha ? 'status-marcha' : 'status-parado'}">
                ${enMarcha ? 'IN MARCIA' : 'FERMO'}
              </span>
            </div>

            <table class="data-table">
              <tr><td>Ore Carico:</td><td>${horasCarico}</td></tr>
              <tr><td>Ore Vuoto:</td><td>${horasVacio}</td></tr>
              <tr><td><strong>Ore Totali:</strong></td><td><strong>${totalHistorico}</strong></td></tr>
              <tr><td>Avviamenti Totali:</td><td>${avviamenti}</td></tr>
              <tr><td colspan="2"><hr style="border: 0.5px solid #eee; margin: 4px 0;"></td></tr>
              <tr><td>Ciclo Programmato:</td><td>${horasProgramadas}</td></tr>
              <tr><td>Tempo Manutenzione:</td><td>${horasRestantes}</td></tr>
            </table>

            <div class="last-packet">
              Ultimo aggiornamento: <strong>${horaUltimoEnvio}</strong>
            </div>
        `;

        if (requiereMantenimiento) {
          popupContent += `
            <div class="alerta-mantenimiento">
              ⚠️ MANUTENZIONE RICHIESTA!
            </div>
          `;
        }

        popupContent += `</div>`;
        popup.setContent(popupContent);

        if (!marker.isPopupOpen()) {
          marker.openPopup();
        }

      } catch (error) {
        console.error("Error ThingSpeak:", error);
        
        // Muestra el error exacto en la tarjeta para saber qué pasa
        let errorContent = `
          <div class="popup-card">
            <div class="popup-header">${NOMBRE_CLIENTE}</div>
            <div class="error-box">
              ⚠️ <strong>Error de lectura:</strong><br>
              ${error.message}
            </div>
            <div class="last-packet">Reintentando lectura cada 15s...</div>
          </div>
        `;
        popup.setContent(errorContent);
        if (!marker.isPopupOpen()) {
          marker.openPopup();
        }
      }
    }

    cargarDatosThingSpeak();
    setInterval(cargarDatosThingSpeak, 15000);
  </script>
</body>
</html>
