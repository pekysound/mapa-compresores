<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetría de Compresores - RMF Magliano Alpi</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #map { width: 100vw; height: 100vh; }

    /* Estilos del Popup */
    .popup-card { min-width: 260px; font-size: 13px; line-height: 1.5; }
    .popup-header {
      font-size: 15px; font-weight: bold;
      border-bottom: 2px solid #007bff;
      padding-bottom: 5px; margin-bottom: 8px; color: #333;
    }
    .badge {
      display: inline-block; padding: 3px 8px;
      border-radius: 12px; font-size: 11px; font-weight: bold;
      color: white; margin-bottom: 8px;
    }
    .status-marcha { background-color: #28a745; }
    .status-parado { background-color: #6c757d; }
    
    /* Alerta visual de Mantenimiento */
    .alerta-mantenimiento {
      background-color: #dc3545; color: white;
      padding: 8px; border-radius: 5px;
      font-weight: bold; text-align: center;
      margin-top: 10px;
      animation: parpadeo 1s infinite alternate;
    }

    @keyframes parpadeo {
      from { opacity: 1; }
      to { opacity: 0.4; }
    }

    .data-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
    .data-table td { padding: 3px 0; }
    .data-table td:last-child { text-align: right; font-weight: bold; }
    
    .last-packet {
      font-size: 10px;
      color: #666;
      text-align: right;
      margin-top: 8px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- CONFIGURACIÓN ---
    const NOMBRE_CLIENTE = "RMF MAGLIANO ALPI";
    const LATITUD = 44.4601;   // Magliano Alpi, Italia
    const LONGITUD = 7.8016;
    const CHANNEL_ID = "3425995"; 

    // Inicializar mapa
    const map = L.map('map').setView([LATITUD, LONGITUD], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    const marker = L.marker([LATITUD, LONGITUD]).addTo(map);

    async function cargarDatosThingSpeak() {
      const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?_nocache=${Date.now()}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        // Mapeo correspondiente al ESP32:
        const horasCarico      = parseFloat(data.field1 || 0).toFixed(1);
        const horasVacio       = parseFloat(data.field2 || 0).toFixed(1);
        const horasProgramadas = parseFloat(data.field3 || 0).toFixed(0);
        const horasRestantes   = parseFloat(data.field4 || 0).toFixed(1);
        const totalHistorico   = parseFloat(data.field5 || 0).toFixed(1);

        // Registro de última actualización
        let horaUltimoEnvio = "Desconocida";
        if (data.created_at) {
          const d = new Date(data.created_at);
          horaUltimoEnvio = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        const requiereMantenimiento = (parseFloat(horasRestantes) <= 0);

        let popupContent = `
          <div class="popup-card">
            <div class="popup-header">${NOMBRE_CLIENTE}</div>

            <table class="data-table">
              <tr><td>Carico:</td><td>${horasCarico} hs</td></tr>
              <tr><td>Vuoto:</td><td>${horasVacio} hs</td></tr>
              <tr><td><strong>Totale Storico:</strong></td><td><strong>${totalHistorico} hs</strong></td></tr>
              <tr><td colspan="2"><hr style="border: 0.5px solid #eee;"></td></tr>
              <tr><td>Ciclo Programado:</td><td>${horasProgramadas} hs</td></tr>
              <tr><td>Tempo Manutenzione:</td><td>${horasRestantes} hs</td></tr>
            </table>

            <div class="last-packet">
              Último paquete PLC: <strong>${horaUltimoEnvio}</strong>
            </div>
        `;

        if (requiereMantenimiento) {
          popupContent += `
            <div class="alerta-mantenimiento">
              ⚠️ ¡MANTENIMIENTO REQUERIDO!
            </div>
          `;
        }

        popupContent += `</div>`;
        marker.bindPopup(popupContent).openPopup();

      } catch (error) {
        console.error("Error al obtener datos de ThingSpeak:", error);
      }
    }

    cargarDatosThingSpeak();
    setInterval(cargarDatosThingSpeak, 15000); // Consulta cada 15 segundos
  </script>
</body>
</html>
